name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Stage the payload
        run: python tools/ci_payload.py
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller zstandard
      # Both apps: `app/` (Rust, the current one) and `app-legacy/` (Python).
      - name: Build the current app (Rust) and the legacy one (Python)
        run: python tools/build_app.py --all
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: release/SHB-OcarinaTweaks.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows-legacy
          path: release/SHB-OcarinaTweaks-legacy.exe
          if-no-files-found: error

  linux:
    name: Linux
    # Pinned to 22.04 on purpose: an older glibc makes the binary run on newer distros (Arch, Fedora, ...).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # The Rust window needs OpenSSL (the updater's TLS) and the Wayland / xkbcommon headers that the portal backend
      # of the file picker asks for through pkg-config. Python and Tk are for the legacy app.
      - name: Install the system libraries, Python and Tk
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            python3-tk python3-pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Stage the payload
        run: python3 tools/ci_payload.py
      - name: Build the current app (Rust)
        run: |
          cargo build --release --manifest-path app/Cargo.toml -p shb-cli
          install -m 755 app/target/release/SHB-OcarinaTweaks release/SHB-OcarinaTweaks-linux
      - name: Install PyInstaller
        run: python3 -m pip install --user --upgrade pyinstaller zstandard
      - name: Build the legacy app (Python)
        run: |
          python3 tools/build_app.py --legacy
          mv release/SHB-OcarinaTweaks-legacy release/SHB-OcarinaTweaks-legacy-linux
          test -x release/SHB-OcarinaTweaks-legacy-linux
      - uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: release/SHB-OcarinaTweaks-linux
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: app-linux-legacy
          path: release/SHB-OcarinaTweaks-legacy-linux
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Stage the payload
        run: python tools/ci_payload.py
      - name: Build the current app (Rust)
        run: |
          cargo build --release --manifest-path app/Cargo.toml -p shb-cli
          ditto -c -k app/target/release/SHB-OcarinaTweaks release/SHB-OcarinaTweaks-macos.zip
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller zstandard
      - name: Build the legacy app (Python)
        run: python tools/build_app.py --legacy
      - name: Package the legacy app (dmg, or zip if the bundle is missing)
        run: |
          set -e
          if [ -d release/SHB-OcarinaTweaks-legacy.app ]; then
            mkdir -p build/dmg
            cp -R release/SHB-OcarinaTweaks-legacy.app build/dmg/
            ln -s /Applications build/dmg/Applications
            hdiutil create -volname "SHB-OcarinaTweaks" -srcfolder build/dmg -ov \
              -format UDZO release/SHB-OcarinaTweaks-legacy-macos.dmg
          else
            ditto -c -k release/SHB-OcarinaTweaks-legacy release/SHB-OcarinaTweaks-legacy-macos.zip
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: release/SHB-OcarinaTweaks-macos.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: app-macos-legacy
          path: |
            release/SHB-OcarinaTweaks-legacy-macos.dmg
            release/SHB-OcarinaTweaks-legacy-macos.zip
          if-no-files-found: error

  presets:
    name: Presets pack
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk (build_app imports the window; make_presets does not, but keep the env identical)
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-pip
      - name: Stage the payload
        run: python3 tools/ci_payload.py
      - name: Install zstandard
        run: python3 -m pip install --user --upgrade zstandard
      - name: Build the presets zip
        run: python3 tools/make_presets.py
      - uses: actions/upload-artifact@v4
        with:
          name: presets
          path: |
            release/SuperHeroBoost-*-presets.zip
            release/SuperHeroBoost-*-presets.zip.sha256
          if-no-files-found: error

  release:
    name: Publish release
    # Publish whatever built: a macOS runner that GitHub never assigns cancels that job, and that
    # must not keep the Linux binary off the release (it happened in 0.6.0).
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [windows, linux, macos, presets]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs
          sparse-checkout-cone-mode: false
      # Every asset on the release page comes from this workflow, so the hashes are the uploaded files' hashes:
      # nothing is uploaded by hand any more (the Windows exe and the presets zip included).
      # One step per artifact: download-artifact's `pattern` is a glob, not a regex ("a|b" never matches).
      - uses: actions/download-artifact@v4
        with:
          name: app-windows
          path: dist
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: app-windows-legacy
          path: dist
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: app-linux
          path: dist
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: app-linux-legacy
          path: dist
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: app-macos
          path: dist
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: app-macos-legacy
          path: dist
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: presets
          path: dist
        continue-on-error: true
      - name: List the assets
        run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
      - name: Use the release notes file when there is one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ -f "docs/RELEASE-$tag.md" ]; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "docs/RELEASE-$tag.md"
          fi
