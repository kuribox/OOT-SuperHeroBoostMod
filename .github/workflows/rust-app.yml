name: Rust app

# Builds and tests the Rust port of the companion app (`app-rs/`). It is not part of the release artifacts: the
# shipped installer is still the Python one.
on:
  workflow_dispatch:
  pull_request:
    paths: ["app-rs/**", ".github/workflows/rust-app.yml"]
  push:
    branches: [main]
    paths: ["app-rs/**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Windows (msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-rs
      - name: Format
        run: cargo fmt --manifest-path app-rs/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path app-rs/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path app-rs/Cargo.toml --workspace
      - name: The text table matches app/i18n.py
        run: python app-rs/tools/gen_i18n.py --check
      - name: The GameCube artwork matches app/gamecube_textures.py
        run: python app-rs/tools/gen_gamecube.py --check
      - name: Every text the window asks for exists
        run: python app-rs/tools/check_gui_keys.py
      # The payload is data, not code: the release binary carries it so one exe installs the mod. Generated here
      # because it is not committed (it holds the built module).
      - name: Stage the payload
        run: python tools/ci_payload.py
      - name: Build
        run: cargo build --manifest-path app-rs/Cargo.toml --release

  parity:
    name: Parity with the Python app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-rs
      - name: Stage the payload
        run: python tools/ci_payload.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install zstandard (the enemy packs are compared after decompression)
        run: python -m pip install zstandard
      - name: Build the CLI
        run: cargo build --manifest-path app-rs/Cargo.toml -p shb-cli
      - name: Compare the patched modules, the installed trees, a recompiled game and a Rekarina install
        run: python app-rs/tools/parity_check.py --app app --payload app/payload --mode all
