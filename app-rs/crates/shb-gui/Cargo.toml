[package]
name = "shb-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Window of the Super Hero Boost companion app"

[[bin]]
name = "shb-gui"
path = "src/main.rs"

[dependencies]
shb-core.workspace = true
# wgpu (eframe's default renderer) with only what the window needs: no accessibility bridge, no clipboard, no
# system-font provider. See `.cargo/config.toml` for the linker note that makes this work on windows-gnu.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.37"
# The folder picker of "Examinar…": the OS dialog, no runtime of our own. On Windows it is the IFileDialog of the
# shell; the GTK/portal backends of Linux are left out (they need C libraries this build cannot link).
rfd = { version = "0.15", default-features = false }
# The logo is the app's own PNG (app/assets/shb.png), decoded at startup for the header and the window icon.
image = { version = "0.25", default-features = false, features = ["png"] }
