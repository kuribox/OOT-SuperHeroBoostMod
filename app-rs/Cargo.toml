[workspace]
members = ["crates/shb-core", "crates/shb-cli", "crates/shb-gui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shb-core = { path = "crates/shb-core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
