[package]
name = "shb-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Window of the Super Hero Boost companion app"

[lib]
name = "shb_gui"
path = "src/lib.rs"

[dependencies]
shb-core.workspace = true
# wgpu (eframe's default renderer) with only what the window needs: no accessibility bridge, no clipboard, no
# system-font provider. `x11` and `wayland` are the backends winit needs on Linux: without them winit has no platform
# there at all ("The platform you're compiling for is not supported by winit"), which the Windows and macOS builds
# never showed. See `.cargo/config.toml` for the linker note that makes this work on windows-gnu.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
egui = "0.37"
# The folder picker of "Examinar…": the OS dialog, no runtime of our own. On Windows it is the IFileDialog of the
# shell; on macOS the NSOpenPanel of the crate. On Linux and the BSDs it needs a backend, and the desktop portal
# (D-Bus, see the target section below) is pure Rust, so it builds where GTK's headers are not installed.
rfd = { version = "0.15", default-features = false }
# The logo is the app's own PNG (app/assets/shb.png), decoded at startup for the header and the window icon.
image = { version = "0.25", default-features = false, features = ["png"] }

# Linux and the BSDs: the folder picker through the XDG desktop portal (D-Bus). Pure Rust — no GTK headers, which is
# what the CI runner has — and the dialog is the desktop's own. The portal needs one async runtime of its own: rfd
# leaves `ashpd` with no default features, and `async-std` is the one its defaults pick (without it `zbus` refuses to
# build: "Either async-io (default) or tokio must be enabled").
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
